environment:
  dt: 0.02
  max_episode_seconds: 50.0

map:
  yaml_path: "maps/demo.yaml"
  unknown_as_occupied: true
  use_project_pixel_thresholds: true
  occupied_pixel_threshold: 10
  free_pixel_threshold: 245

robot:
  radius: 0.30
  max_speed: 1.0
  max_acceleration: 2.0
  max_angular_speed: 2.0
  actuator_tau_min: 0.05
  actuator_tau_max: 0.20
  spin_velocities: [0.0, -2.0, 2.0]

observation:
  num_rays: 64
  ray_max_range: 4.0
  path_points: 12
  path_point_interval: 0.25
  path_normalization_range: 4.0

path:
  min_start_goal_distance: 4.0
  max_start_goal_distance: 20.0
  safety_margin: 0.10
  astar_stride: 2
  resample_spacing: 0.20
  max_sampling_attempts: 100

termination:
  goal_tolerance: 0.20

reward:
  progress: 5.0
  path_error: 2.0
  action_change: 0.20
  control_effort: 0.05
  clearance: 3.0
  clearance_threshold: 0.50
  time: 0.01
  goal: 100.0
  collision: 100.0

mpc:
  N: 100
  bridge_timeout_seconds: 10.0
