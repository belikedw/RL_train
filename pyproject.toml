[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rm-sentry-rl"
version = "0.1.0"
description = "Lightweight reinforcement-learning environment for RM sentry local control"
requires-python = ">=3.10,<3.13"
dependencies = [
  "gymnasium>=0.29,<2",
  "numpy>=1.23,<3",
  "Pillow>=9,<12",
  "PyYAML>=6,<7",
  "scipy>=1.9,<2",
]

[project.optional-dependencies]
train = [
  "stable-baselines3[extra]>=2.3,<3",
  "onnx>=1.15,<2",
  "onnxruntime>=1.17,<2",
  "tensorboard>=2.14,<3",
]
test = [
  "pytest>=7,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
